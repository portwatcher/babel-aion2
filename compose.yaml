name: babel-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: babel
      POSTGRES_USER: babel
      POSTGRES_PASSWORD: babel
    ports:
      - '127.0.0.1:55432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U babel -d babel']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
