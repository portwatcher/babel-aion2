services:
  livekit:
    image: livekit/livekit-server:v1.13.10@sha256:89ca9ce0791e18d6e03bf6e2c49ceb27e1c754eae8bd50c989386c1a5963791a
    command: ['--config', '/livekit.yaml']
    volumes:
      - ./livekit.yaml:/livekit.yaml:ro
  probe:
    image: node:24.22.1-bookworm-slim@sha256:55fb5f5a527ea2c5c4a95f963e48ef90aa38c7b346054fdc8ee9957a2b55d205
    depends_on:
      - livekit
    working_dir: /probe
    volumes:
      - .:/probe:ro
      - node-modules:/probe/node_modules
    command: ['sh', '-c', 'npm ci --no-audit --no-fund && npm run check:livekit']
volumes:
  node-modules:
